# App Engine configuration for Google Cloud
runtime: python311

env: standard

instance_class: F2

entrypoint: uvicorn main:app --host 0.0.0.0 --port $PORT

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 1
  max_instances: 10

env_variables:
  ENVIRONMENT: 'production'
  
handlers:
- url: /.*
  script: auto
  secure: always
  redirect_http_response_code: 301
